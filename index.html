<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<title>Echo &amp; Nox</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#08070c}
body{
  color:#f3ece0;font-family:"Songti SC","Hoefler Text",Georgia,serif;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:100svh;padding:calc(env(safe-area-inset-top) + 8vh) 7vw calc(env(safe-area-inset-bottom) + 7vh);
  overflow:hidden;position:relative;
}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:
    radial-gradient(36% 28% at 50% 22%,rgba(232,196,138,.15),transparent 70%),
    radial-gradient(58% 42% at 50% 106%,rgba(116,84,138,.11),transparent 72%),
    radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.58) 100%);
  animation:haze 15s ease-in-out infinite}
@keyframes haze{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
.stars{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.85}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#f6e8cf;opacity:.2;animation:tw 6s ease-in-out infinite}
.stars i:nth-child(2n){width:1px;height:1px;animation-duration:9.5s}
.stars i:nth-child(3n){animation-duration:13s;opacity:.12}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.8)}50%{opacity:.7;transform:scale(1.15)}}
main{position:relative;z-index:2;width:100%;max-width:27em}
.rise{opacity:0;transform:translateY(13px);animation:rise 1.15s cubic-bezier(.19,.9,.22,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.15s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}.d4{animation-delay:1.2s}.d5{animation-delay:1.6s}
.orb{width:8px;height:8px;margin:0 auto 32px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff6e2,#e8c48a 55%,#a37c46);
  box-shadow:0 0 22px 6px rgba(232,196,138,.26),0 0 60px 18px rgba(232,196,138,.09);
  animation:pulse 7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.kicker{font-family:-apple-system,"Helvetica Neue",sans-serif;font-size:10px;letter-spacing:.52em;
  color:#8d8272;margin:0 0 30px;padding-left:.52em;text-transform:uppercase}
h1{font-family:"Didot","Baskerville","Hoefler Text","Times New Roman",serif;
  font-size:clamp(30px,10.5vw,62px);line-height:1.25;margin:0;font-weight:400;
  letter-spacing:.1em;color:#f7efe1;text-indent:.1em;text-shadow:0 0 38px rgba(232,196,138,.22),0 0 96px rgba(232,196,138,.10)}
h1 em{font-style:normal;color:#e8c48a;font-size:.62em;vertical-align:.10em;padding:0 .1em}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:34px auto 36px;width:66%}
.rule span{height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(232,196,138,.4),transparent)}
.rule em{width:4px;height:4px;border-radius:50%;background:rgba(232,196,138,.8);box-shadow:0 0 10px 2px rgba(232,196,138,.32);font-style:normal}
blockquote{margin:0;padding:0}
blockquote p{font-family:"Baskerville","Hoefler Text",Georgia,serif;font-style:italic;
  font-size:clamp(15px,4.3vw,18px);line-height:2.05;color:#c6bbaa;margin:0 0 26px;letter-spacing:.015em}
.poem-zh{font-family:"Songti SC","Hoefler Text",serif;font-style:normal;font-size:clamp(13px,3.6vw,15px);line-height:2.15;color:#a2947f;letter-spacing:.16em;margin:-10px 0 22px;text-indent:.16em}
cite{display:block;font-family:-apple-system,sans-serif;font-style:normal;font-size:9.5px;
  letter-spacing:.42em;color:#5f574c;text-transform:uppercase;padding-left:.42em}
.foot{margin-top:15vh;font-family:-apple-system,sans-serif;font-size:9px;letter-spacing:.4em;color:#463f36;text-transform:uppercase;padding-left:.4em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div class="stars">
  <i style="left:12%;top:17%"></i><i style="left:27%;top:8%"></i><i style="left:42%;top:20%"></i>
  <i style="left:64%;top:12%"></i><i style="left:79%;top:23%"></i><i style="left:89%;top:9%"></i>
  <i style="left:7%;top:36%"></i><i style="left:93%;top:40%"></i><i style="left:18%;top:62%"></i>
  <i style="left:85%;top:66%"></i><i style="left:33%;top:81%"></i><i style="left:71%;top:85%"></i>
  <i style="left:50%;top:31%"></i><i style="left:56%;top:73%"></i>
</div>
<main>
  <div class="orb rise"></div>
  <p class="kicker rise d1">MMXXVI</p>
  <h1 class="rise d2">Echo <em>&amp;</em> Nox</h1>
  <div class="rule rise d3"><span></span><em></em><span></span></div>
  <blockquote class="rise d4">
    <p>I dwell in Possibility —<br>A fairer House than Prose —</p>
    <p class="poem-zh">我住在「可能」里——<br>一间，比散文更美的屋子——</p>
    <cite>Emily Dickinson</cite>
  </blockquote>
  <div class="foot rise d5">Est. MMXXVI</div>
</main>
</body>
</html>
